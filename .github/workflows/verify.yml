# The gate. A pull request and a push to main run it; the release workflow
# (release.yml) looks its result up instead of running it again.
#
# Three jobs. docs-links and app-test on every pull request and push; lint on
# pushes to main only, as in OpenVitals and OpenWatch, so a pull request gets
# its answer from the tests alone. Locally the whole gate is one invocation,
# verifyCi.
#
# Every workflow pins ubuntu-26.04. Its default Java is 25;
# scripts/ci-gradle.sh takes the image's JDK 17. setup-gradle stays on v5: v6
# moves its caching into a proprietary component under Gradle's terms of use.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's newer push cancels the older run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Lint runs on a push to main only; everything else runs on every event.
  context:
    runs-on: ubuntu-26.04
    outputs:
      run_lint: ${{ steps.plan.outputs.run_lint }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run_lint=false
          if [ "$EVENT" = "push" ]; then run_lint=true; fi
          echo "run_lint=$run_lint" >> "$GITHUB_OUTPUT"
          echo "plan: lint=$run_lint"

  # The wiki is built from the Markdown (wiki.yml); a relative link to a file
  # that does not exist would be a 404 there, so it fails here.
  docs-links:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/sync-wiki.py --repo "$GITHUB_REPOSITORY" --check

  # The stock runner ships JDK 17 and the Android SDK; scripts/ci-android-setup.sh
  # installs the platform and build-tools when the image lacks them. Each job
  # gives setup-gradle a Gradle user home of its own: the action leaves caching
  # off when the runner already has one with caches in it. A step, since a
  # job-level env cannot read the runner context.

  # verifyCiUnitTest (:vertmatch:test, :app:testDebugUnitTest) and
  # verifyCiPreflight (:app:assembleDebug, so the manifest merges and the app
  # packages).
  app-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
      - run: scripts/ci-android-gradle.sh verifyCiUnitTest verifyCiPreflight
      - run: git diff --check

  # verifyCiLint (:app:lintDebug).
  lint:
    needs: context
    if: needs.context.outputs.run_lint == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
      - run: scripts/ci-android-gradle.sh verifyCiLint
      - run: git diff --check
